<!DOCTYPE html>
<meta charset="utf-8">
<title>붙여넣기 확인용</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html,body{margin:0;height:100%;background:#f2f4f7;font-family:system-ui,sans-serif}
  textarea{box-sizing:border-box;width:100%;height:100%;padding:10px;border:0;font:12px/1.4 monospace;white-space:pre;overflow:auto}
</style>
<textarea id="t" spellcheck="false" autocomplete="off" aria-label="임시 텍스트"></textarea>
<script>
  // 이 페이지는 아무것도 저장하지 않는다. 브라우저 안에서만 쓰는 임시 붙여넣기 칸이다.
  document.getElementById('t').focus();
</script>
