<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>모바일 미리보기 (390×844)</title>
<style>
  html,body{margin:0;padding:0;background:#e9edf3;overflow:hidden;}
  iframe{display:block;width:390px;height:844px;border:0;margin:0;background:#f2f4f7;}
</style>
</head>
<body>
<iframe id="frame" src="./index.html?v=22-c" width="390" height="844" title="작업사진 등록 웹앱 모바일 미리보기"></iframe>
<script>
  // 확인용 화면에서만: 폰 화면에는 없는 데스크톱 스크롤바를 감춘다 (앱 자체는 건드리지 않음)
  var f = document.getElementById('frame');
  function hideScrollbar() {
    try {
      var d = f.contentDocument;
      var st = d.getElementById('mp-noscroll') || d.createElement('style');
      st.id = 'mp-noscroll';
      st.textContent = '::-webkit-scrollbar{width:0;height:0;display:none}' +
        'html,body{scrollbar-width:none;-ms-overflow-style:none} html{overflow-y:scroll}::-webkit-scrollbar-thumb{display:none}';
      d.head.appendChild(st);
    } catch (e) {}
  }
  f.addEventListener('load', hideScrollbar);
  hideScrollbar();
</script>
</body>
</html>
